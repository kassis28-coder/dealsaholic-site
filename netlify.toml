[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/deals"
  to = "/.netlify/functions/get-deals"
  status = 200

[[redirects]]
  from = "/api/fetch-walmart-deals"
  to = "/.netlify/functions/fetch-walmart-deals"
  status = 200

[[redirects]]
  from = "/api/submit-email-deal"
  to = "/.netlify/functions/submit-email-deal"
  status = 200

[[redirects]]
  from = "/api/create-joylink"
  to = "/.netlify/functions/create-joylink"
  status = 200

[[redirects]]
  from = "/api/deal-image"
  to = "/.netlify/functions/deal-image"
  status = 200

[[redirects]]
  from = "/api/post-to-facebook"
  to = "/.netlify/functions/post-to-facebook"
  status = 200

# Render deal pages server-side so Facebook and other sharing services receive
# the product image, while the page keeps the original working deal behavior.
[[redirects]]
  from = "/deal.html"
  to = "/.netlify/functions/deal-meta"
  status = 200
  force = true

[[redirects]]
  from = "/deal"
  to = "/.netlify/functions/deal-meta"
  status = 200
  force = true
