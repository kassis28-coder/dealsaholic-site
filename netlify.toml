[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/deals"
  to = "/.netlify/functions/get-deals"
  status = 200

[[redirects]]
  from = "/api/fetch-walmart-deals"
  to = "/.netlify/functions/fetch-walmart-deals"
  status = 200

[[redirects]]
  from = "/deal"
  to = "/.netlify/functions/deal-meta"
  status = 200
  force = true
